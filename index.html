<head>

  <meta name="theme-color" content="#090b12">
  <meta name="description" content="Xauzy Studio — jasa pembuatan landing page, bio link, dan web app cepat dan responsif, mulai Rp150 ribuan.">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta property="og:image" content="https://kingrelaxed.github.io/project-/favicon.png">
  <meta property="og:image:alt" content="Xauzy Studio — logo neon X">
  <meta name="twitter:image" content="https://kingrelaxed.github.io/project-/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
          colors: { night: '#090b12', panel: '#121520', electric: '#b8ff5c', violet: '#a78bfa' }
        }
      }
    };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(128, 99, 208, .16), transparent 34rem);
    }
    .glass { background: rgba(18, 21, 32, .78); backdrop-filter: blur(18px); }
    @keyframes avatar-float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }
    @keyframes avatar-glow {
      0%, 100% { opacity: .55; transform: scale(.92); }
      50% { opacity: .9; transform: scale(1.08); }
    }
    @keyframes status-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(184, 255, 92, .42); }
      50% { box-shadow: 0 0 0 5px rgba(184, 255, 92, 0); }
    }
    .avatar-creative { animation: avatar-float 4.8s ease-in-out infinite; }
    .avatar-glow { animation: avatar-glow 3.6s ease-in-out infinite; }
    .status-dot { animation: status-pulse 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .avatar-creative, .avatar-glow, .status-dot { animation: none; }
    }
  </style>
</head>

        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4"/></svg>
        <span>Share / Copy Link</span>
      </button>




      <div class="relative mx-auto h-28 w-28 sm:h-32 sm:w-32">
